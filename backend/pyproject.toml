[project]
name = "geobench-copilot-backend"
version = "0.1.0"
description = "Agentic backend for GeoBench Copilot — matches uploaded geospatial datasets against torchgeo-bench experiments"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "anthropic>=0.116",
    "pandas>=2.2",
    "numpy>=1.26",
    "tifffile>=2024.5.10",
    "pillow>=10.3",
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3"]
satellite = ["rasterio>=1.3", "pystac-client>=0.8", "planetary-computer>=1.0"]
# `uv run --extra dev pytest -q` — rasterio is needed for the resolution tests,
# httpx for the TestClient that exercises the static-file allowlist.
dev = ["pytest>=8", "httpx>=0.27", "rasterio>=1.3"]

[tool.uv]
package = false
